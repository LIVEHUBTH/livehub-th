<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LIVEHUB TH | Live Concert & Replay</title>

  <meta
    name="description"
    content="ศูนย์รวมไลฟ์สตรีมคอนเสิร์ตและรีเพลย์คอนเสิร์ต LIVEHUB TH"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="page">

    <!-- ส่วนหัวเว็บไซต์ -->
    <header>

      <div class="logo-text">
        LIVE<span>HUB TH</span>
      </div>

      <nav>
        <a href="#home" class="active">หน้าแรก</a>
        <a href="#live">LIVE CONCERT</a>
        <a href="#replay">REPLAY CONCERT</a>
        <a href="#packages">แพ็กเกจ</a>
        <a href="#contact">ติดต่อ</a>
      </nav>

    </header>

    <!-- ส่วนแนะนำเว็บไซต์ -->
    <main>

      <section class="hero" id="home">

        <div class="hero-content">

          <h1>
            LIVE<span>HUB TH</span>
          </h1>

          <p class="hero-description">
            ศูนย์รวมไลฟ์สตรีมคอนเสิร์ต<br>
            และรีเพลย์คอนเสิร์ต
          </p>

          <div class="hero-buttons">

            <a
              href="#live"
              class="button button-primary"
            >
              ◉ ดูคอนเสิร์ตสด
            </a>

            <a
              href="#replay"
              class="button"
            >
              ▷ ดูรีเพลย์
            </a>

          </div>

        </div>

        <div
          class="hero-image"
          role="img"
          aria-label="เวทีคอนเสิร์ต LIVEHUB TH"
        ></div>

      </section>

    </main>

  </div>

</body>
</html>
